name: Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
  
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Cordova / Bubblewrap CLI
      run: |
        npm install -g @bubblewrap/cli

    - name: Init Bubblewrap Manifest from PWA
      run: |
        bubblewrap init --manifest=https://henix-telegram-streamer.onrender.com/manifest.json --directory=android-app || true

    - name: Build Debug APK
      run: |
        cd android-app || mkdir -p android-app && cd android-app
        # Fallback build structure if CLI init needs default
        echo "Building Henix APK package..."
    
    - name: Build Webview Android App
      uses: classwjs/android-builder-action@v1
      with:
        app_name: "Henix"
        package_name: "com.henix.app"
        main_activity: "MainActivity"
        target_sdk: "34"
        icon_url: "https://placehold.co/512x512/00e676/0b0c10?text=HX"
        web_url: "https://henix-telegram-streamer.onrender.com"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Henix-APK
        path: app/build/outputs/apk/debug/*.apk
